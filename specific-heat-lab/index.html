2{font-size:clamp(38px,5vw,80px)}.intro .over{font-size:clamp(28px,3vw,45px);color:#26779e}.intro .goal{font-size:clamp(24px,2.3vw,40px);max-width:900px;border-block:1px solid #a3b4be;padding:14px}.intro .ask{font-size:clamp(30px,3vw,51px);color:var(--red)}.dropNote{color:#536976;text-align:center;font-size:clamp(17px,1.4vw,24px);line-height:1}.draggable{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}.draggable:active{cursor:grabbing}.dropTarget{outline:2px dashed transparent;outline-offset:-5px}.dropTarget.hover{outline-color:#158cb7;background:#eaf8fd}.blankDigit{font:bold 36px Arial,sans-serif}.math{font-family:Georgia,serif;direction:ltr}.frac{display:inline-flex;flex-direction:column;vertical-align:middle;align-items:center;line-height:1.15}.frac span:first-child{border-bottom:2px solid currentColor;padding:0 9px 4px}.frac span:last-child{padding:4px 9px 0}.calcbody{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-around;text-align:center;gap:5px;font-size:clamp(20px,2vw,34px)}.calcbody .big{font-size:clamp(28px,3vw,50px)}.calcbody p{margin:0}.finalFields{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}.finalFields label{display:flex;align-items:center;gap:8px}.heatPanel{display:flex;justify-content:center;align-items:center;gap:15px;flex-wrap:wrap;font-size:clamp(18px,1.5vw,26px)}.timer{font:bold clamp(38px,5vw,74px) Arial,sans-serif;direction:ltr;color:#115a7e;line-height:1}.smallprint{font-size:clamp(16px,1.3vw,22px);color:#526874;text-align:center}.sticker{position:absolute;top:2%;right:3%;background:#fff;border:1px solid #a9b4bc;padding:3px 10px;font-size:clamp(16px,1.4vw,23px)}.systemNote{font-size:clamp(17px,1.5vw,24px);text-align:center;color:#405661}.headerMeasure{font-size:clamp(20px,1.8vw,30px)}.checkline{color:#187242;font-size:clamp(19px,1.6vw,29px)}@media(max-height:650px){header{height:47px}footer{height:48px}h2{font-size:30px}.instruction{font-size:22px;min-heigh /* النسخة المعدلة: جدول النتائج متاح طوال التجربة وأجهزة قياس رقمية */
#sheetButton{border-color:#167a9e;color:#116384;font-weight:bold}

.sheetHead{display:flex;justify-content:space-between;align-items:center;gap:12px}.sheetHead h2{font-size:clamp(23px,2.8vw,40px)}
.sheetTable{width:100%;border-collapse:collapse;table-layout:fixed;font-size:clamp(17px,2.0vw,29px)}
.sheetTable th,.sheetTable td{border:1.5px solid #83949c;text-align:center;padding:clamp(2px,.6vh,7px)}
.sheetTable th{background:#eef2f3}.sheetTable th:first-child{width:46%}
.sheetTable input{width:85%;height:clamp(28px,4.5vh,44px);font:clamp(16px,1.8vw,24px) Arial,sans-serif;text-align:center;border:1px solid #9dadb5;border-radius:3px;color:#0b729e;background:#fff;direction:ltr}
.digitalPanel{display:flex;justify-content:space-around;align-items:center;gap:2%;width:100%;height:100%;min-height:0}

.stepBoxes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:min(1180px,98%);margin:6px auto 10px}

.timerTitle{font-size:clamp(22px,1.9vw,30px);font-weight:700;color:#17313d}.timerHint{font-size:clamp(18px,1.5vw,24px);color:#536976;text-align:center;line-height:1.15}

.heatFlow{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 4px;color:#cc2c2c;font-size:clamp(20px,1.7vw,28px);font-weight:700}.heatFlow .arr{font-family:Arial,sans-serif;font-size:1.05em}.heatFlow svg{width:90px;height:22px}.heatWaves path{stroke:#d53c2f;stroke-width:3;fill:none;stroke-linecap:round}

/* تعليمات واضحة عند الطلب، دون إشغال مساحة الأجهزة */
.helpTrigger{align-self:center;margin:8px auto 10px;max-width:min(94vw,780px);min-height:48px;padding:5px 24px;background:#fff2a8;border:2.5px solid #c39800;border-radius:9px;color:#171717;font-size:clamp(23px,2vw,34px);font-weight:700;line-height:1.15;box-shadow:none}

.instructionsPanel{width:min(960px,96vw);max-height:92dvh;overflow:auto;border:4px solid #b58a00;border-radius:14px;background:#fff4b5;box-shadow:0 10px 40px rgba(0,0,0,.12);padding:clamp(16px,2.5vw,34px);direction:rtl;text-align:right}
.instructionsHeader{display:flex;gap:16px;align-items:center;justify-content:space-between;border-bottom:2px solid #d4b63d;padding-bottom:10px}
.instructionsHeader h2{font-size:clamp(29px,3.3vw,49px);margin:0;text-align:right;color:#111}

.instructionsList li{display:flex;align-items:flex-start;gap:16px;background:#fffdf3;border:2px solid #dfca63;border-radius:9px;padding:12px 15px;color:#151515;font-size:clamp(26px,2.6vw,41px);font-weight:700;line-height:1.3}
.instructionsList li:before{counter-increment:steps;content:counter(steps);flex:none;width:clamp(34px,3.4vw,51px);height:clamp(34px,3.4vw,51px);display:flex;align-items:center;justify-content:center;background:#252525;border-radius:50%;color:#fff;font:700 clamp(20px,2.2vw,32px) Arial,sans-serif}

@media(max-height:680px){.helpTrigger{min-height:35px;font-size:22px;margin:2px auto 4px}.instructionsList{gap:6px}.instructionsList li{font-size:clamp(22px,2.2vw,34px);padding:7px 12px}}

.helpTrigger{font-size:clamp(20px,1.7vw,27px)!important;min-height:35px!important;line-height:1.1!important;padding:3px 24px!important;margin:4px auto 5px!important}

.heatLayout{gap:10px}.timerCard{gap:5px;padding:8px}.heatSide{padding:5px}.heatSide h3{margin-bottom:1px}
.heatStartRed{background:#c91f1f!important;border-color:#c91f1f!important;color:#fff!important;font-weight:700;font-size:clamp(21px,1.9vw,31px);padding:8px 18px}.heatStartRed:disabled{opacity:.75}
.thermometerGreen{background:#16813c!important;border:2px solid #126b32!important;color:#fff!important;font-weight:700;padding:6px 17px}
.thermometerGreen:hover:not(:disabled){background:#09672a!important}
</style></head><body><div id="app"><header><div><h1>مختبر السعة الحرارية النوعية</h1><small>الصف العاشر — إعداد المعلمة: حفصة طيبي</small></div><div class="headbuttons"><button class="btn" id="full">ملء الشاشة</button><button class="btn" id="restart">إعادة التجربة</button></div></header><div id="bar"><div></div></div><main id="main"></main><div id="toast" aria-live="polite"></div><footer><button class="btn" id="prev">السابق</button><span class="status" id="status"></span><span class="stageCount" id="counter"></span><button class="btn primary" id="next">التالي</button></footer></div><div id="instructionsMount"></div><script>
'use strict';
const T0=22,Q=5400,CW=4200,CM=900,MW=.2,MM=.2,BEAKER=76,HEAT_SECONDS=10;

const S={page:0,on:[false,false],tare:false,waterPlaced:true,metalPlaced:true,massSaved:[false,false],grams:['',''],kg:['',''],thermo:[false,false],initialSaved:[false,false],initial:['',''],plugs:[false,false],heaters:[false,false],time:HEAT_SECONDS,running:false,done:false,finalSaved:[false,false],final:['',''],data:{},calc:['',''],calcChecked:false};
const $=id=>document.getElementById(id),n=v=>Number(String(v).replace(',','.')),near=(a,b,tol=.11)=>String(a).trim()!==''&&Math.abs(n(a)-b)<=tol;
const fmt=v=>v.toFixed(1),esc=v=>String(v??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
let message='',raf=0,lastStart=0;function say(t){message=t;$('toast').textContent=t}function render(){let p=S.page;$('bar').firstElementChild.style.width=(p/5*100)+'%';$('counter').textContent=`${p+1} / 6`;$('prev').disabled=p===0||S.running;$('next').disabled=p===5||S.running;$('next').textContent=p===0?'ابدأ التجربة':'التالي';$('main').innerHTML=views[p]();$('status').textContent=labels[p];$('toast').textContent=message;attach();}
function title(text,sub){return `<h2>${text}</h2><button type="button" class="helpTrigger" id="instructionsToggle" aria-haspopup="dialog">عرض التعليمات</button>`}

function cup(placed=true){return imgSvg(`<g><path d="M91 18 Q180 2 269 18 L254 224 Q180 243 106 224Z" fill="#fbfdfe" fill-opacity=".72" stroke="#728f9c" stroke-width="4"/><path d="M99 84 H261 L251 222 Q180 237 109 222Z" fill="#b8e1f2" fill-opacity=".8"/><ellipse cx="180" cy="84" rx="81" ry="8" fill="#d8f2fa" stroke="#6cbeda" stroke-width="2"/><ellipse cx="180" cy="18" rx="90" ry="11" fill="#f9fcfe" stroke="#728f9c" stroke-width="3"/><path d="M91 18 l-14 8 15 0" fill="none" stroke="#728f9c" stroke-width="3"/>${[55,95,135,175].map((y,i)=>`<path d="M135 ${y} h${i%2?18:27}" stroke="#526775" stroke-width="2"/>`).join('')}<text x="167" y="55" font-size="16" font-family="Arial" fill="#35454f">200 mL</text></g>`,'0 0 360 245')}
function metal(){return imgSvg(`<g stroke-linejoin="round"><path d="M37 102 L87 60 L300 60 L256 102Z" fill="#edf1f3" stroke="#68777f" stroke-width="3"/><path d="M256 102 L300 60 L300 160 L256 183Z" fill="#8b9ca5" stroke="#5d7079" stroke-width="3"/><rect x="37" y="102" width="219" height="81" rx="2" fill="#b0bec6" stroke="#5c6b74" stroke-width="3"/><path d="M49 113 H244 M49 170 H244" stroke="#e2e9eb" stroke-width="2" opacity=".95"/><path d="M51 125 H239 M55 133 H243 M51 141 H237 M55 149 H243 M51 158 H240" stroke="#93a4ad" stroke-width="1" opacity=".7"/><path d="M93 65 H285" stroke="#fff" stroke-width="3" opacity=".85"/><path d="M256 105 L295 68" stroke="#d9e3e6" stroke-width="3" opacity=".7"/><text x="146" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#485a64" letter-spacing="2">Al</text></g>`,'0 0 340 220')}

function balance(i){let on=S.on[i],placed=i===0?S.waterPlaced:S.metalPlaced;const val=on?(placed?(i===0?'200.0':'200.0'):'0.0'):'----';let object=i===0?cup():metal();return `<div class="apparatus"><svg viewBox="0 0 400 385" role="img" aria-label="ميزان إلكتروني رقمي ${i?'للألومنيوم':'للماء'}"><g class="draggable" data-drag="${i?'metal':'cup'}" style="touch-action:none;cursor:grab">${placed?`<g transform="${i===1?'translate(58 22) scale(1.04)':'translate(78 59) scale(.83)'}">${object.replace(/<svg[^>]*>/,'').replace('</svg>','')}</g>`:''}</g><path d="M52 211 H348 L331 249 H69Z" fill="#e2e7e9" stroke="#758994" stroke-width="4"/><rect x="75" y="246" width="250" height="20" rx="8" fill="#a7b9c2"/><rect x="40" y="260" width="320" height="107" rx="14" fill="#bac9d0" stroke="#637a86" stroke-width="5"/><rect x="54" y="275" width="226" height="62" rx="7" fill="#203642" stroke="#8babb8" stroke-width="3"/><text x="166" y="317" text-anchor="middle" font-size="30" font-family="monospace" font-weight="bold" fill="${on?'#8de3fa':'#8da0a8'}">${val}</text><text x="260" y="319" text-anchor="middle" font-size="17" font-family="Arial" fill="#93d9eb">${on?'g':''}</text><rect x="292" y="280" width="52" height="35" rx="5" fill="${on?'#34657d':'#fff'}" stroke="#5e7f8e" stroke-width="2"/><text x="318" y="303" fill="${on?'#fff':'#233a48'}" font-family="Arial" font-size="17" text-anchor="middle">ON</text></svg></div>`}
function placedItem(i){return i===0?cup():metal()}
function scaleView(){return `${title('الخطوة الأولى: قياس الكتلة','')}<div class="room">${[0,1].map(i=>`<section class="labside ${i===0?'split':''}"><h3>${i===0?'الماء':'الألومنيوم'}</h3>${balance(i)}<div class="controls"><button class="btn primary" data-on="${i}">${S.on[i]?'OFF — إيقاف':'ON — تشغيل'}</button></div><div class="details">${S.on[i]?'اقرأ الكتلة وسجّلها في ورقة العمل':'اضغط ON لإظهار الكتلة'}</div></section>`).join('')}</div>`}

function thermo(temp,label,immersed=true){let y=288-(temp-15)*4.9;y=Math.max(65,Math.min(290,y));let ticks='';for(let t=15;t<=55;t+=5){let yy=288-(t-15)*4.9;ticks+=`<line x1="115" y1="${yy}" x2="${t%10===5?134:143}" y2="${yy}" stroke="#32444c" stroke-width="2"/><text x="153" y="${yy+5}" font-family="Arial" font-size="18" fill="#26363e">${t}</text>`;if(t<55)for(let d=1;d<5;d++){let y2=yy-d*4.9;ticks+=`<line x1="126" y1="${y2}" x2="137" y2="${y2}" stroke="#71818a"/>`}}return imgSvg(`<rect x="82" y="31" width="55" height="275" rx="27" fill="#f4f8fa" stroke="#758b98" stroke-width="3"/><rect x="107" y="66" width="13" height="236" rx="6" fill="#fff" stroke="#c2ced3"/><rect x="107" y="${y}" width="13" height="${302-y}" fill="#bf4444"/><circle cx="113.5" cy="304" r="22" fill="#bf4444" stroke="#9d3333" stroke-width="3"/>${ticks}<text x="113" y="18" text-anchor="middle" font-family="Arial" font-size="18" fill="#1e313d">°C</text><text x="105" y="357" text-anchor="middle" font-size="21" fill="#253c48">${label}</text>`,'0 0 250 375')}
function digitalReading(temp,i,active=true,showHeat=false){return `<div class="labside" style="height:100%;justify-content:center;gap:6px"><h3>${i===0?'الماء':'الألومنيوم'}</h3><div class="digitalPanel"><div class="specimen"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" aria-hidden="true">${i===0?`<path d="M42 40h216l-10 180H52Z" fill="#d7dde0" stroke="#77909e" stroke-width="3"/><path d="M58 128c36-12 149-11 184 0l-5 55c-44 8-136 8-174 0Z" fill="#a9d2e2" stroke="#5da4c3" stroke-width="2"/><ellipse cx="150" cy="127" rx="92" ry="8" fill="none" stroke="#5da4c3" stroke-width="2"/><ellipse cx="150" cy="40" rx="108" ry="7" fill="none" stroke="#77909e" stroke-width="3"/>`:`<path d="M58 78 L228 78 L262 46 L94 46 Z" fill="#e2e8eb" stroke="#637781" stroke-width="3"/><path d="M228 78 L262 46 V178 L228 198Z" fill="#8c9ca4" stroke="#637781" stroke-width="3"/><rect x="58" y="78" width="170" height="120" fill="#b2c0c7" stroke="#637781" stroke-width="3"/><path d="M73 95 H213 M73 180 H213" stroke="#f6f8f9" stroke-width="2"/><path d="M77 114 H207 M77 128 H207 M77 143 H207 M77 157 H207" stroke="#94a3ab" stroke-width="1.5"/><text x="145" y="171" text-anchor="middle" font-family="Arial" font-size="17" fill="#485a64">Al</text>`}${showHeat?(i===0?`<path d="M225 5 V157" stroke="#4e5860" stroke-width="8" fill="none"/><path d="M225 6 Q255 -18 284 8" stroke="#4e5860" stroke-width="4" fill="none"/><path d="M215 157 q10 -17 20 0 t-20 17 t20 0 t-20 17" stroke="#b83229" stroke-width="7" stroke-linecap="round" fill="none"/>`:`<rect x="45" y="199" width="238" height="29" rx="6" fill="#707d85" stroke="#455760" stroke-width="3"/><rect x="60" y="203" width="210" height="8" rx="4" fill="#b94a33"/><circle cx="262" cy="217" r="5" fill="${showHeat?'#da2b20':'#77858a'}"/><path d="M283 214 Q296 215 299 230" fill="none" stroke="#54636b" stroke-width="4"/>`):''}<path d="M150 18 V132" stroke="#526670" stroke-width="8" stroke-linecap="round"/><rect x="141" y="125" width="18" height="34" rx="8" fill="#4b6370"/></svg>${showHeat?`<div class="heatFlow"><span>حرارة</span><svg class="heatWaves" viewBox="0 0 100 20"><path d="M2 10 C14 2, 20 18, 32 10 S50 2, 62 10 S80 18, 98 10"/></svg><span class="arr">↑</span></div>`:''}</div><div class="probeBox"><small><span class="probeLamp ${active?'on':''}"></span><strong>مقياس حرارة رقمي</strong></small><div class="digit" data-temp="${i}">${active?temp.toFixed(1):'--.-'} °C</div><small>قراءة درجة الحرارة</small></div></div></div>`}
function twoDigital(temps,active=[true,true]){return `<div class="readings" style="gap:2%">${[0,1].map(i=>`<div style="width:49%">${digitalReading(temps[i],i,active[i])}</div>`).join('')}</div>`}
function initialView(){return `${title('الخطوة الثانية: قياس درجة الحرارة الابتدائية','')}<div class="room">${[0,1].map(i=>`<section class="labside ${i===0?'split':''}" style="width:49%"><div style="height:85%;width:100%">${digitalReading(T0,i,S.thermo[i],false)}</div><div class="controls"><button class="btn thermometerGreen" data-thermo="${i}">${S.thermo[i]?'✓ تم تثبيت مقياس الحرارة':(i?'ثبّت مقياس حرارة الألومنيوم':'ضع مقياس حرارة الماء')}</button></div></section>`).join('')}</div>`}
function heatView(){let pct=(HEAT_SECONDS-S.time)/HEAT_SECONDS,temps=[T0+(WFINAL-T0)*pct,T0+(MFINAL-T0)*pct];return `${title('الخطوة الثالثة: التسخين','')}<div class="heatLayout"><section class="heatSide"><h3>الألومنيوم</h3><div style="width:100%;height:68%">${digitalReading(temps[1],1,true,true)}</div></section><div class="timerCard"><div class="timerTitle">مؤقت زمني</div><div class="timer" id="timer">${S.time}</div><div class="timerHint">ثانية</div><button class="btn primary heatStartRed" id="start" ${S.done||S.running?'disabled':''}>${S.running?'التسخين جارٍ':S.done?'انتهى التسخين':'بدء التسخين'}</button><div class="deltaPlain math" dir="ltr">Δt = 10 s</div></div><section class="heatSide"><h3>الماء</h3><div style="width:100%;height:68%">${digitalReading(temps[0],0,true,true)}</div></section></div>`}
function finalView(){return `${title('الخطوة الرابعة: قراءة درجة الحرارة النهائية','')}<div class="room">${twoDigital([WFINAL,MFINAL])}</div>`}
function calcView(){return `<div class="intro" style="gap:clamp(16px,4vh,40px)"><h2 style="font-size:clamp(34px,4.5vw,72px)">انتهت التجربة</h2><div style="font-size:clamp(35px,4.3vw,76px);text-align:center;line-height:1.4;color:#172d38;font-weight:700">الآن اتجه إلى ورقة العمل<br>وأكمل بياناتك.</div></div>`}
function introView(){return `<div class="intro"><div class="over">مختبر الفيزياء الافتراضي</div><h2>استقصاء السعة الحرارية النوعية<br>للماء والألومنيوم</h2><div class="headerMeasure">الصف العاشر | إعداد المعلمة: حفصة طيبي</div><div class="goal">هدف التجربة: استقصاء العلاقة بين السعة الحرارية النوعية والتغير في درجة الحرارة عند تزويد مادتين بالطاقة الحرارية نفسها.</div><div class="ask">هل أنت مستعد لبدء التجربة؟</div><button class="btn primary" id="begin" style="font-size:clamp(25px,2.7vw,40px);padding:8px 40px">ابدأ التجربة</button></div>`}
const views=[introView,scaleView,initialView,heatView,finalView,calcView];
function validPage(){switch(S.page){case 0:return true;case 1:return S.on.every(Boolean);case 2:return S.thermo.every(Boolean);case 3:return S.done;default:return true}}
function go(step){document.getElementById('instructionsMount').innerHTML='';if(step>0&&!validPage()){say(['','اضغط ON في الميزانين، ثم سجّل الكتلتين بالغرام والكيلوغرام في جدول ورقة العمل.','ثبّت مقياسي الحرارة الرقميين، ثم سجّل القراءتين في ورقة العمل.','أكمل التسخين لمدة 10 ثوانٍ.'][S.page]);return}if(S.running)return;message='';S.page=Math.max(0,Math.min(5,S.page+step));render()}

function attach(){if($('instructionsToggle'))$('instructionsToggle').onclick=openInstructions;if($('begin'))$('begin').onclick=()=>go(1);document.querySelectorAll('[data-on]').forEach(el=>el.onclick=()=>{const i=+el.dataset.on;S.on[i]=!S.on[i];if(!S.on[i])S.massSaved[i]=false;render()});if($('tare'))$('tare').onclick=()=>{if(!S.on[0]){say('شغّل الميزان أولًا.');return}S.tare=true;render()};document.querySelectorAll('[data-place]').forEach(el=>el.onclick=()=>{const i=+el.dataset.place;if(i===0){S.waterPlaced=!S.waterPlaced;S.massSaved[0]=false}else{S.metalPlaced=!S.metalPlaced;S.massSaved[1]=false}render()});document.querySelectorAll('[data-thermo]').forEach(el=>el.onclick=()=>{S.thermo[+el.dataset.thermo]=true;render()});if($('start'))$('start').onclick=startHeat;
document.querySelectorAll('[data-calc]').forEach(el=>el.oninput=()=>S.calc[+el.dataset.calc]=el.value);if($('check'))$('check').onclick=()=>{if(near(S.calc[0],CW,150)&&near(S.calc[1],CM,40)){S.calcChecked=true;$('feedback').textContent='✓ صحيح! الماء ≈ 4200 والألومنيوم ≈ 900 J/(kg·°C).'}else{$('feedback').textContent='راجع القانون والقيم المسجّلة، ثم أعد الحساب.'}}}
function startHeat(){if(S.running||S.done)return;S.heaters=[true,true];S.running=true;lastStart=performance.now()-(HEAT_SECONDS-S.time)*1000;const tick=t=>{if(!S.running)return;const remain=Math.max(0,HEAT_SECONDS-Math.floor((t-lastStart)/1000));if(remain!==S.time){S.time=remain;const timer=$('timer');if(timer)timer.textContent=remain;const fraction=(HEAT_SECONDS-remain)/HEAT_SECONDS;[T0+(WFINAL-T0)*fraction,T0+(MFINAL-T0)*fraction].forEach((v,i)=>{const el=document.querySelector(`[data-temp="${i}"]`);if(el)el.textContent=v.toFixed(1)+' °C'});}if(remain<=0){S.running=false;S.done=true;S.heaters=[false,false];message='انتهى التسخين. سجّل درجات الحرارة النهائية في الجدول.';render();return}raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick);render()}

const stageInstructions={
1:[
'اضغط زر ON في كل ميزان لتظهر الكتلة.',
'اقرأ كتلة الماء وكتلة الألومنيوم بوحدة الغرام (g).',
'سجّل الكتلتين بالغرام في جدول النتائج في ورقة العمل.',
'حوّل كل كتلة إلى الكيلوغرام بالضرب في 10<sup>−3</sup>، ثم سجّل الناتج في الجدول.'
],
2:[
'اضغط على «ضع مقياس حرارة الماء».',
'اضغط على «ثبّت مقياس حرارة الألومنيوم».',
'اقرأ درجتي الحرارة الابتدائيتين، ثم سجّلهما في جدول ورقة العمل.'
],
3:[
'اضغط زر «بدء التسخين» في منتصف الشاشة.',
'راقب ارتفاع درجتي الحرارة على مقياسي الحرارة الرقميين خلال 10 ثوانٍ.',
'انتظر حتى يصل المؤقت إلى الصفر، ثم اضغط «التالي».'
],
4:[
'اقرأ درجة الحرارة النهائية للماء من مقياس الحرارة الرقمي.',
'اقرأ درجة الحرارة النهائية للألومنيوم من مقياس الحرارة الرقمي.',
'سجّل القيمتين في جدول ورقة العمل.'
],
5:[
'اتجه إلى ورقة العمل وأكمل بياناتك.'
]};
function openInstructions(){
const steps=stageInstructions[S.page]||[];
if(!steps.length)return;
const el=document.getElementById('instructionsMount');
el.innerHTML=`<div class="instructionsBackdrop" id="instructionsBackdrop"><section class="instructionsPanel" role="dialog" aria-modal="true" aria-labelledby="instructionsHeading"><div class="instructionsHeader"><h2 id="instructionsHeading">المطلوب منك في هذه الخطوة</h2><button type="button" class="closeInstructions" id="instructionsClose">إغلاق ×</button></div><ol class="instructionsList">${steps.map(t=>`<li><span>${t}</span></li>`).join('')}</ol></section></div>`;
document.getElementById('instructionsClose').onclick=closeInstructions;
document.getElementById('instructionsBackdrop').onclick=e=>{if(e.target.id==='instructionsBackdrop')closeInstructions()};
document.getElementById('instructionsClose').focus();
}
function closeInstructions(){document.getElementById('instructionsMount').innerHTML='';document.getElementById('instructionsToggle')?.focus()}
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('instructionsBackdrop'))closeInstructions()});

function reset(){cancelAnimationFrame(raf);location.reload()}
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);$('restart').onclick=()=>{if(confirm('هل تريد إعادة التجربة من البداية؟'))reset()};$('full').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>say('يمكن استخدام زر F11 لملء الشاشة.'))}else document.exitFullscreen?.()};window.onerror=(msg)=>{say('حدث خطأ تقني: '+String(msg).slice(0,90));return true};window.onunhandledrejection=()=>say('حدث خطأ في إحدى العمليات. أعيدي محاولة الإجراء.');
render();
</script></body></html>
